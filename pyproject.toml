[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "readmit"
version = "1.0.0"
description = "30-day readmission risk (LACE, HOSPITAL) with grounded LLM extraction from discharge summaries and a transition-of-care plan."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
readmit = "readmit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
per-file-ignores = { "src/readmit/plan.py" = ["E501"] }
